<!doctype html>
<html lang="en" data-palette="bone" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>RoutineForge · Log in</title>
  <meta name="theme-color" content="#C9543A"/><!-- token: brand.primary -->
  <!-- Token sources: design/tokens.ts + design/tokens.css.
       Each --c-* / --s-* / --r-* / --fs-* / --d-* / --e-* / --sh-* below
       maps 1:1 to a key under tokens.color, .spacing, .radius, .type.size,
       .motion.duration, .motion.easing, .shadow respectively.            -->
  <link rel="stylesheet" href="../tokens.css"/>
  <link rel="stylesheet" href="../base.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    /* page chrome (not part of the design — just to show the screen) */
    /* tokens used: --c-surface-base, --font-sans, --c-text-secondary */
    html, body { background: #f0eee9; margin: 0; }
    body { font-family: var(--font-sans); color: var(--c-text-primary); }
    .page { max-width: 1700px; margin: 0 auto; padding: 32px 24px 80px; }
    .page h1 {
      margin: 0 0 4px 0; font-size: 32px; letter-spacing: -.02em; font-weight: 600;
      color: #1a140f; /* token: text.primary (bone/light) */
    }
    .page p.lead { margin: 0 0 28px 0; color: rgba(60,50,40,.7); font-size: 14px; }
    .ctrls {
      display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 28px 0; align-items: center;
    }
    .ctrls .seg { display: inline-flex; gap: 0; padding: 3px; border-radius: 999px; background: #ece3ce; }
    .ctrls .seg button {
      border: 0; background: transparent; padding: 6px 14px; border-radius: 999px;
      font: inherit; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
      font-family: ui-monospace, "Geist Mono", monospace; color: rgba(60,50,40,.7);
      cursor: pointer;
    }
    .ctrls .seg button[aria-pressed="true"] { background: #fff; color: #1a140f; box-shadow: 0 1px 2px rgba(36,28,18,.06); }
    .ctrls .label { font-family: ui-monospace, "Geist Mono", monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: rgba(60,50,40,.55); margin-right: 8px; }
    .stage {
      display: grid; gap: 32px;
      grid-template-columns: 414px 1fr;
      align-items: flex-start;
    }
    @media (max-width: 900px) { .stage { grid-template-columns: 1fr; } }
    .frame-cap {
      font-family: ui-monospace, "Geist Mono", monospace; font-size: 11px;
      letter-spacing: .12em; text-transform: uppercase; color: rgba(60,50,40,.55);
      margin: 0 0 10px 4px;
    }
  </style>
</head>
<body>
  <div class="page">
    <header style="display:flex; align-items:baseline; justify-content:space-between; gap:24px; flex-wrap:wrap;">
      <div>
        <div style="font-family:ui-monospace,'Geist Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:rgba(60,50,40,.55);">RoutineForge · mockup</div>
        <h1>Log in</h1>
        <p class="lead">Mobile (390) + desktop (1280). Light + dark.</p>
      </div>
      <div class="ctrls">
        <span class="label">Palette</span>
        <div class="seg" role="tablist" id="paletteSeg">
          <button data-v="bone" aria-pressed="true">bone</button>
          <button data-v="fog">fog</button>
          <button data-v="sage">sage</button>
          <button data-v="graphite">graphite</button>
        </div>
        <span class="label" style="margin-left:8px;">Theme</span>
        <div class="seg" role="tablist" id="themeSeg">
          <button data-v="light" aria-pressed="true">light</button>
          <button data-v="dark">dark</button>
          <button data-v="both">both</button>
        </div>
      </div>
    </header>

    <div id="root"></div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="../icons.jsx"></script>
  <script type="text/babel" src="../primitives.jsx"></script>
  <script type="text/babel" src="../screens/auth.jsx"></script>

  <script type="text/babel" data-presets="react">
    function Stage() {
      const [palette, setPalette] = React.useState('bone');
      const [theme, setTheme] = React.useState('light');

      React.useEffect(() => {
        const onSeg = (id, fn) => {
          const seg = document.getElementById(id);
          if (!seg) return;
          seg.addEventListener('click', (e) => {
            const b = e.target.closest('button'); if (!b) return;
            seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
            fn(b.dataset.v);
          });
        };
        onSeg('paletteSeg', setPalette);
        onSeg('themeSeg', setTheme);
      }, []);

      React.useEffect(() => {
        document.documentElement.setAttribute('data-palette', palette);
        document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
      }, [palette, theme]);

      const themes = theme === 'both' ? ['light','dark'] : [theme];

      return (
        <React.Fragment>
          <RoughDefs/>
          {themes.map((t, i) => (
            <section key={t} style={{ marginTop: i === 0 ? 0 : 56 }}>
              <div className="frame-cap">Log in · {t}</div>
              <div className="stage">
                <div>
                  <div className="frame-cap">mobile · 390 × 844</div>
                  <LoginMobile palette={palette} dark={t === 'dark'}/>
                </div>
                <div>
                  <div className="frame-cap">desktop · 1280 × 820</div>
                  <LoginDesktop palette={palette} dark={t === 'dark'}/>
                </div>
              </div>
            </section>
          ))}
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Stage/>);
  </script>
</body>
</html>
